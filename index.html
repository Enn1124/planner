<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록 플래너</title>
<meta name="theme-color" content="#2B4EFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="블록 플래너">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Nanum+Myeongjo&family=Gaegu&family=Do+Hyeon&family=Jua&family=Gowun+Dodum&family=Gowun+Batang&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--card:#FFFFFF;--ink:#182035;--sub:#7B8496;
  --line:#E6E9EF;--accent:#2B4EFF;--accent-soft:#EDF0FF;--danger:#C2255C;--good:#0FA36B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:18px 16px 84px;position:relative}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:12px;color:var(--sub)}.badge.err{color:var(--danger)}
#panels{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
@media(max-width:680px){#panels{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:12px}
.panel.droptarget{outline:2px dashed var(--accent);outline-offset:4px;background:var(--accent-soft);border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.card-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin:0}
.empty{font-size:13px;color:var(--sub);margin:0;line-height:1.6}
.edit-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:8px;
  padding:5px 7px;background:var(--accent-soft);border-radius:9px;cursor:grab}
.edit-bar span{font-size:11px;font-weight:800;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input:not([type=color]):not([type=file]):not([type=range]):not([type=checkbox]),select,textarea{
  font-family:inherit;font-size:14px;padding:9px 11px;border-radius:10px;
  border:1.5px solid var(--line);outline:none;width:100%;color:var(--ink);background:#FBFCFE}
input:not([type=color]):not([type=file]):not([type=range]):not([type=checkbox]):focus,select:focus{border-color:var(--accent)}
input[type=number]{text-align:center;padding:8px 4px}
input[type=color]{width:30px;height:30px;border:none;border-radius:8px;padding:2px;cursor:pointer;background:none;-webkit-appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
button{font-family:inherit;cursor:pointer}
.btn{font-size:13px;font-weight:700;padding:10px 0;border-radius:10px;border:none;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.gray{background:var(--card);color:var(--sub);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff;border:none}
.icon-btn{font-size:13px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--sub);flex-shrink:0;line-height:1}
.icon-btn.danger{color:var(--danger)}
.chip-btn{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);white-space:nowrap}
.chip-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.tag-chip{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.todo{display:flex;align-items:center;gap:9px;padding:6px 0 6px 9px}
.check{width:23px;height:23px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:#fff;font-size:12px;font-weight:800;line-height:1;flex-shrink:0}
.todo-text{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-sub{font-size:11px;color:var(--sub)}
.done .todo-text{text-decoration:line-through;color:var(--sub)}
.block-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.block-bar{width:4px;height:15px;border-radius:2px;flex-shrink:0}
.progress{height:6px;border-radius:4px;background:#EEF0F5;overflow:hidden}
.progress>div{height:100%;border-radius:4px;transition:width .3s}
.trow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.trow .ttime{font-size:12px;color:var(--sub);width:84px;flex-shrink:0;font-variant-numeric:tabular-nums}
.trow .cbar{width:5px;align-self:stretch;border-radius:3px}
.dday-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dday-card{border-radius:12px;padding:10px 12px;color:#fff;position:relative;overflow:hidden}
.dday-name{font-size:11px;font-weight:700;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday-date{font-size:10px;opacity:.7;margin-bottom:4px}
.dday-num{font-size:23px;font-weight:900;letter-spacing:-.03em;line-height:1}
.dday-del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:6px;border:none;background:rgba(0,0,0,.18);color:#fff;font-size:11px;font-weight:800;display:none}
body.editing .dday-del{display:block}
#board,.sticker-scope{position:relative;background:#F2F4F8;border-radius:12px;border:1.5px dashed var(--line);overflow:hidden;touch-action:none}
.sticker-item{position:absolute;user-select:none;touch-action:none}
body.editing .sticker-item{cursor:grab}
.sticker-item img{width:100%;height:100%;object-fit:contain;border-radius:6px;pointer-events:none;display:block}
.sticker-text-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.35;word-break:break-all;white-space:pre-wrap;padding:5px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);pointer-events:none}
.sticker-emoji-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.resize-handle{position:absolute;bottom:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:se-resize;touch-action:none;display:none}
.del-handle{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid #fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;line-height:1;touch-action:none;display:none}
body.editing .sticker-item .resize-handle{display:block}
body.editing .sticker-item .del-handle{display:flex}
.sticker-ctrl{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
  display:none;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;z-index:99}
.sticker-ctrl button{font-size:11px;font-weight:800;width:26px;height:24px;border:none;
  background:none;color:var(--ink);border-radius:5px;cursor:pointer}
.sticker-ctrl button:active{background:var(--accent-soft)}
#style-popup-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
#style-popup{background:var(--card);border-radius:16px;padding:16px;max-width:340px;width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.2)}
#block-popup-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
#block-popup{background:var(--card);border-radius:16px;padding:16px;max-width:380px;width:100%;
  max-height:70vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.trow-click{cursor:pointer}
.trow-click:active{background:var(--accent-soft)}
.circle-svg path{cursor:pointer}
body.editing .sticker-item:hover .sticker-ctrl,body.editing .sticker-item.selected .sticker-ctrl{display:flex}
#screen-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
#screen-layer .sticker-item{pointer-events:none}
body.editing #screen-layer .sticker-item{pointer-events:auto}
.pomo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.pomo-dial{position:relative;width:116px;height:116px}
.pomo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pomo-time{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
#pomo-phase{font-size:11px;font-weight:700}
#pomo-block-label{font-size:10px;color:var(--sub);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numfield{font-size:11px;color:var(--sub);font-weight:700;display:flex;flex-direction:column;gap:3px}
.numfield input{width:60px}
.dash{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.dash-col{min-width:225px;max-width:245px;flex-shrink:0;background:#FAFBFD;border:1px solid var(--line);border-radius:12px;padding:10px}
.dash-col-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:8px;padding:6px 8px;border-radius:8px;color:#fff}
.dash-proj{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-grid .d{font-size:10px;font-weight:700;color:var(--sub);text-align:center;margin-bottom:2px}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.deadline-chip{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap}
/* 투두 드래그 */
.todo-drag{cursor:grab;color:var(--sub);font-size:16px;padding:4px 8px;flex-shrink:0;touch-action:none;user-select:none}
.todo-dragging{opacity:.4}
.todo-dragover{border-top:2px solid var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav .inner{display:flex;width:100%;max-width:980px;overflow-x:auto}
nav button{flex:1;min-width:80px;padding:13px 6px;border:none;background:none;font-size:14px;font-weight:500;color:var(--sub);border-top:2px solid transparent;white-space:nowrap}
nav button.on{font-weight:800;color:var(--accent);border-top-color:var(--accent)}
#edit-toolbar{position:sticky;top:8px;z-index:15;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:10px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(43,78,255,.12)}
#settings-pop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.overdue-chip{font-size:10px;font-weight:800;background:#FFF0F3;color:var(--danger);border:1px solid #FFD6DF;border-radius:6px;padding:2px 6px;white-space:nowrap}
/* 주간 뽀모 차트 */
.pomo-chart{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:8px}
.pomo-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.pomo-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;background:var(--accent);transition:height .3s}
.pomo-bar-label{font-size:9px;color:var(--sub);font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <div class="topbar">
    <h1>블록 플래너</h1>
    <span class="badge" id="save-badge" style="margin-right:auto"></span>
    <button class="chip-btn" id="edit-btn" onclick="A.editToggle()">✎ 편집</button>
    <button class="chip-btn" onclick="A.settingsToggle()">⚙</button>
  </div>
  <div id="settings-slot"></div>
  <div id="toolbar-slot"></div>
  <div id="panels-wrap" style="position:relative">
    <div id="panels">
      <div class="panel" id="panel-aux"
        ondragover="event.preventDefault();this.classList.add('droptarget')"
        ondragleave="this.classList.remove('droptarget')"
        ondrop="A.cDrop(event,'aux')"></div>
      <div class="panel" id="panel-main"
        ondragover="event.preventDefault();this.classList.add('droptarget')"
        ondragleave="this.classList.remove('droptarget')"
        ondrop="A.cDrop(event,'main')"></div>
    </div>
    <div id="screen-layer"></div>
  </div>
</div>
<nav><div class="inner" id="tabbar"></div></nav>
<script>
"use strict";
const PALETTE=["#2B4EFF","#E8590C","#0FA36B","#9C36B5","#0B7285","#C2255C","#5F3DC4","#B08D00"];
const DAY_NAMES=["일","월","화","수","목","금","토"];
const WEEK_ORDER=[1,2,3,4,5,6,0];
const SECTION_LABELS={"timetable":"오늘의 시간표","today-todos":"오늘의 투두","pomodoro":"뽀모도로","dday":"D-Day","sticker-board":"스티커 보드","blocks-settings":"하루 블록 설정","tags-settings":"태그 설정","projects":"프로젝트"};
const DEFAULT_THEME={accent:"#2B4EFF",bg:"#F6F7F9",card:"#FFFFFF",ink:"#182035"};
const uid=()=>Math.random().toString(36).slice(2,9);
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
/* hoursPerTodo는 내부적으로 항상 시간(소수) 단위. 표시만 분으로 변환 */
const hpt2min=h=>Math.round(h*60);
const min2hpt=m=>m/60;
const fmtDur=h=>{if(h<=0)return"0분";const tot=Math.round(h*60);return tot>=60&&tot%60===0?tot/60+"시간":tot>=60?(Math.floor(tot/60)+"시간 "+tot%60+"분"):(tot+"분");};
const fmtDate=d=>(d.getMonth()+1)+"/"+d.getDate()+"("+DAY_NAMES[d.getDay()]+")";
const fmtClock=h=>{const hh=Math.floor(((h%24)+24)%24),mm=Math.round(h%1*60);return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isProjDone=p=>p.todos.length>0&&p.todos.every(t=>t.done);
const todayDate=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
function calcDDayNum(dateStr){const t=todayDate(),g=new Date(dateStr);g.setHours(0,0,0,0);return Math.round((g-t)/864e5);}
const calcDDay=ds=>{const n=calcDDayNum(ds);return n===0?"D-Day!":n>0?"D-"+n:"D+"+(-n);};
const addDays=(ds,n)=>{const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

/* ── 저장 ── */
const store={mode:"memory",
  async get(k){if(typeof window.storage!=="undefined"&&window.storage&&window.storage.get){this.mode="claude";try{const r=await window.storage.get(k);return r?r.value:null;}catch{return null;}}
    try{this.mode="local";return localStorage.getItem(k);}catch{this.mode="memory";return null;}},
  async set(k,v){if(this.mode==="claude"){try{await window.storage.set(k,v);return true;}catch{return false;}}
    if(this.mode==="local"){try{localStorage.setItem(k,v);return true;}catch{return false;}}return true;}
};

/* ── 데이터 ── */
let data=null;
const ui={tab:"main",edit:false,settingsOpen:false,openProject:null,addDDay:false,editProject:null};
let saveTimer=null;

const defaultTabs=()=>[
  {id:"main",name:"메인",builtin:true,aux:["dday","pomodoro","sticker-board"],main:["timetable","today-todos"]},
  {id:"plan",name:"계획",builtin:true,aux:["dday","pomodoro","sticker-board"],main:["blocks-settings","tags-settings"]},
  {id:"project",name:"프로젝트",builtin:true,aux:["dday","pomodoro","sticker-board"],main:["projects"]}
];
function makeDefault(){
  const study={id:uid(),name:"공부",color:PALETTE[0],weekHours:{0:2,1:4,2:4,3:4,4:4,5:4,6:2}};
  const life={id:uid(),name:"생활",color:PALETTE[2],weekHours:{0:1,1:1,2:1,3:1,4:1,5:1,6:1}};
  return{version:6,view:"circle",dayStart:0,todoSort:"block",projView:"list",
    tags:[study,life],
    blocks:[{id:uid(),label:"수면",hours:7,tagId:null},{id:uid(),label:"아침 루틴",hours:1,tagId:life.id},
      {id:uid(),label:"오전",hours:4,tagId:study.id},{id:uid(),label:"오후",hours:4,tagId:study.id},
      {id:uid(),label:"저녁",hours:4,tagId:null},{id:uid(),label:"자유",hours:4,tagId:null}],
    projects:[],pomodoro:{work:25,rest:5},pomoLog:{},ddays:[],
    boardStickers:[],boardH:200,screenStickers:[],tabs:defaultTabs(),theme:{...DEFAULT_THEME}};
}
function migrate(d){
  if(!d)return makeDefault();
  if(!d.version)d.version=1;
  if(d.version<2){
    const tag={id:uid(),name:"일반",color:PALETTE[0],weekHours:d.weekHours||{0:2,1:4,2:4,3:4,4:4,5:4,6:2}};
    d.tags=[tag];d.blocks=(d.blocks||[]).map(b=>({...b,tagId:b.tagId??null}));
    d.projects=(d.projects||[]).map(p=>({id:p.id,name:p.name,tagId:tag.id,priority:p.priority,hoursPerTodo:p.hoursPerTodo||1,
      todos:Array.from({length:p.totalTodos||0},(_,i)=>({id:uid(),text:"할 일 "+(i+1),done:false,doneAt:null}))}));
  }
  if(d.version<6){
    d.version=6;d.pomoLog=d.pomoLog||{};d.ddays=d.ddays||[];
    d.boardStickers=d.boardStickers||d.stickers||[];delete d.stickers;
    d.boardH=d.boardH||d.stickerBoardH||200;delete d.stickerBoardH;
    d.screenStickers=d.screenStickers||[];d.tabs=d.tabs||defaultTabs();
    d.theme=d.theme||{...DEFAULT_THEME};d.todoSort=d.todoSort||"block";d.projView=d.projView||"list";
    delete d.layout;
    d.projects.forEach(p=>{
      if(!("deadline"in p))p.deadline=null;
      if(!("dailyCap"in p))p.dailyCap=null; // 프로젝트별 하루 최대 시간
      p.todos=p.todos||[];
      p.todos.forEach(t=>{if(!("doneAt"in t))t.doneAt=null;if(!("order"in t))t.order=0;});
      p.todos.forEach((t,i)=>{t.order=i;});
    });
    // tabs: 누락된 섹션 보완
    const all=Object.keys(SECTION_LABELS);
    (d.tabs||[]).forEach(tab=>{
      for(const k of all)if(!tab.aux.includes(k)&&!tab.main.includes(k)){}
    });
  }
  return d;
}
function save(){
  data.updatedAt=Date.now();
  setBadge("저장 중…");clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const ok=await store.set("planner-state",JSON.stringify(data));
    setBadge(ok?"저장됨 ✓":"저장 실패",!ok);
    if(ok)setTimeout(()=>setBadge(fmtDate(new Date())),1500);
    fbPush(); // Firebase에 밀어넣기
  },700);
}
function setBadge(t,err){const b=document.getElementById("save-badge");b.textContent=t;b.className="badge"+(err?" err":"");}
function applyTheme(){const r=document.documentElement.style,t=data.theme;r.setProperty("--accent",t.accent);r.setProperty("--bg",t.bg);r.setProperty("--card",t.card);r.setProperty("--ink",t.ink);r.setProperty("--accent-soft",t.accent+"18");}
const curTab=()=>data.tabs.find(t=>t.id===ui.tab)||data.tabs[0];

/* ── 계산 로직 ── */
function allocateDay(hours,items){
  /* items: [{id,remaining,weight,cap}]  cap = 하루 최대 (없으면 Infinity) */
  const alloc={};items.forEach(p=>alloc[p.id]=0);
  let left=hours,active=items.filter(p=>p.remaining>0.001);
  for(let pass=0;pass<20&&left>0.001&&active.length>0;pass++){
    const totalW=active.reduce((s,p)=>s+p.weight,0);let used=0;
    for(const p of active){
      const share=Math.floor(left*p.weight/totalW/0.5)*0.5;
      const capLeft=(p.cap||Infinity)-alloc[p.id];
      const give=Math.min(share,p.remaining-alloc[p.id],capLeft);
      if(give>0){alloc[p.id]+=give;used+=give;}
    }
    left-=used;
    if(used<0.25){
      let gave=false;
      for(const p of[...active].sort((a,b)=>b.weight-a.weight)){
        const capLeft=(p.cap||Infinity)-alloc[p.id];
        if(left>=0.5&&p.remaining-alloc[p.id]>=0.5&&capLeft>=0.5){alloc[p.id]+=0.5;left-=0.5;gave=true;break;}
      }if(!gave)break;}
    active=items.filter(p=>{const capLeft=(p.cap||Infinity)-alloc[p.id];return p.remaining-alloc[p.id]>0.001&&capLeft>0.001;});
  }return alloc;
}

/* 핵심: 남은 투두 수를 정확히 계산 (오늘 완료분 제외하지 않음 — 오늘 이미 완료한 건 오늘 처리됨) */
function remainingTodos(p,asOfKey){
  /* asOfKey=null이면 전체 미완료, asOfKey=날짜면 그날 포함 이전에 완료된 것 제외 */
  return p.todos.filter(t=>!t.done||(asOfKey&&t.doneAt>asOfKey)).length;
}

function simulateAll(){
  const tk=todayKey(),todayAlloc={},finish={};
  for(const tag of data.tags){
    const projs=data.projects
      .filter(p=>p.tagId===tag.id)
      .filter(p=>p.todos.filter(t=>!t.done).length>0) // 미완료 투두가 있는 것만
      .sort((a,b)=>a.priority-b.priority);
    const n=projs.length;
    /* 오늘부터 남은 투두 수로 remaining 계산 */
    const state=projs.map((p,i)=>({
      id:p.id,
      remaining:p.todos.filter(t=>!t.done).length*p.hoursPerTodo,
      weight:n-i,
      cap:p.dailyCap||null
    }));
    const date=new Date();date.setHours(0,0,0,0);
    for(let day=0;day<730;day++){
      const alive=state.filter(s=>s.remaining>0.001);if(!alive.length)break;
      const avail=tag.weekHours[date.getDay()]||0;
      if(avail>0){
        const alloc=allocateDay(avail,alive);
        for(const s of state){if(alloc[s.id]>0){
          if(day===0)todayAlloc[s.id]=alloc[s.id];
          s.remaining-=alloc[s.id];
          if(s.remaining<=0.001&&!finish[s.id])finish[s.id]=new Date(date);
        }}
      }
      date.setDate(date.getDate()+1);
    }
  }return{todayAlloc,finish};
}

/* ── 밀린 프로젝트 감지 (5번 재구현) ──
   "예정 종료일이 설정 마감일을 넘긴" 프로젝트를 찾아서,
   마감일을 지키려면 계획된 배분 외에 추가로 해야 할 투두들을 계산 */
function getBehindProjects(sim){
  const result=[];
  const today=todayDate();
  for(const p of data.projects){
    if(!p.deadline)continue;
    const undone=p.todos.filter(t=>!t.done).sort((a,b)=>(a.order??0)-(b.order??0));
    if(undone.length===0)continue;
    const deadline=new Date(p.deadline);deadline.setHours(23,59,59,0);
    const fin=sim.finish[p.id];
    /* 예정 종료일이 없거나(1년 내 종료 불가) 마감을 넘긴 경우 */
    const isBehind=!fin||new Date(fin)>deadline;
    if(!isBehind)continue;

    /* 마감일까지 이 프로젝트에 배분될 예정 시간을 시뮬레이션으로 계산 */
    const tag=data.tags.find(t=>t.id===p.tagId);
    const tagColor=tag?tag.color:"#999";
    let plannedHours=0;
    if(tag){
      /* 태그 내 프로젝트들로 간단 재시뮬레이션 (마감일까지만) */
      const projs=data.projects.filter(q=>q.tagId===tag.id&&q.todos.some(t=>!t.done))
        .sort((a,b)=>a.priority-b.priority);
      const n=projs.length;
      const state=projs.map((q,i)=>({id:q.id,remaining:q.todos.filter(t=>!t.done).length*q.hoursPerTodo,weight:n-i,cap:q.dailyCap||null}));
      const date=new Date(today);
      const maxDays=Math.max(0,calcDDayNum(p.deadline))+1; /* 오늘~마감일 */
      for(let day=0;day<maxDays;day++){
        const alive=state.filter(s=>s.remaining>0.001);if(!alive.length)break;
        const avail=tag.weekHours[date.getDay()]||0;
        if(avail>0){
          const alloc=allocateDay(avail,alive);
          for(const s of state){if(alloc[s.id]>0){
            s.remaining-=alloc[s.id];
            if(s.id===p.id)plannedHours+=alloc[s.id];
          }}
        }
        date.setDate(date.getDate()+1);
      }
    }
    /* 마감까지 소화 가능한 투두 수 vs 남은 투두 수 → 초과분 */
    const plannedCnt=Math.floor(plannedHours/p.hoursPerTodo+1e-9);
    const extraCnt=Math.max(0,undone.length-plannedCnt);
    if(extraCnt===0)continue; /* 계획대로면 맞출 수 있음 */
    /* 추가로 해야 할 투두 = 뒤에서부터가 아니라 앞 순서대로 extraCnt개
       (계획 배분 외의 것들 = 리스트 뒷부분이 자연스러움) */
    const extraTodos=undone.slice(plannedCnt);
    const dLeft=calcDDayNum(p.deadline);
    result.push({
      projectId:p.id,projName:p.name,tagColor,hours:p.hoursPerTodo,
      deadline:p.deadline,daysLeft:dLeft,
      finish:fin||null,
      extraTodos,extraHours:extraTodos.length*p.hoursPerTodo
    });
  }
  return result;
}

/* ── 오늘 플랜 생성 (1번 버그 수정: 모든 블록 처리) ── */
function buildTodayPlan(sim){
  const tk=todayKey(),queues={};
  for(const tag of data.tags){
    const projs=data.projects.filter(p=>p.tagId===tag.id).sort((a,b)=>a.priority-b.priority);
    const q=[];
    for(const p of projs){
      const allocH=sim.todayAlloc[p.id]||0;
      if(allocH<=0)continue;
      /* 미완료 투두만 (order 순 정렬) */
      const pool=p.todos.filter(t=>!t.done).sort((a,b)=>(a.order??0)-(b.order??0));
      /* 오늘 이미 완료한 것도 포함 (체크 취소 가능하게) */
      const doneTodayPool=p.todos.filter(t=>t.done&&t.doneAt===tk).sort((a,b)=>(a.order??0)-(b.order??0));
      const fullPool=[...doneTodayPool,...pool];
      const cnt=Math.min(Math.ceil(allocH/p.hoursPerTodo-1e-9),fullPool.length);
      for(let i=0;i<cnt;i++)q.push({todo:fullPool[i],projectId:p.id,projName:p.name,
        hours:p.hoursPerTodo,tagId:tag.id,priority:p.priority,deadline:p.deadline});
    }
    queues[tag.id]=q;
  }
  /* 블록 배치 — 태그가 있는 모든 블록을 순회 */
  const byBlock={};
  data.blocks.forEach(b=>byBlock[b.id]=[]);
  const unplaced={};
  for(const tag of data.tags){
    const items=queues[tag.id]||[];if(!items.length)continue;
    const tagBlocks=data.blocks.filter(b=>b.tagId===tag.id);
    if(!tagBlocks.length){
      if(!unplaced[tag.id])unplaced[tag.id]=[];
      unplaced[tag.id].push(...items);
      continue;
    }
    let idx=0;
    for(const b of tagBlocks){
      let cap=b.hours;
      while(idx<items.length&&items[idx].hours<=cap+1e-9){
        byBlock[b.id].push(items[idx]);cap-=items[idx].hours;idx++;
      }
    }
    /* 블록 용량 초과분은 마지막 블록에 추가 */
    while(idx<items.length)byBlock[tagBlocks[tagBlocks.length-1].id].push(items[idx++]);
  }
  return{byBlock,unplaced,queues};
}

function blockTimes(){let cum=data.dayStart;return data.blocks.map(b=>{const s=cum,e=cum+b.hours;cum=e;return{...b,start:s,end:e};});}
const tagMap=()=>Object.fromEntries(data.tags.map(t=>[t.id,t]));
const pomoCountToday=bid=>(data.pomoLog[todayKey()]||{})[bid]||0;

/* ── 최소 일당 시간 계산 (6번) ── */
function calcMinDailyHours(p,sim){
  if(p.todos.filter(t=>!t.done).length===0)return null;
  if(!p.deadline)return null;
  const daysLeft=Math.max(1,calcDDayNum(p.deadline));
  const remaining=p.todos.filter(t=>!t.done).length*p.hoursPerTodo;
  return Math.ceil((remaining/daysLeft)*10)/10;
}

/* ── 뽀모도로 ── */
const pomo={phase:"work",running:false,leftMs:null,endAt:null,cycles:0,blockId:null,iv:null};
function pomoDur(ph){return(ph==="work"?data.pomodoro.work:data.pomodoro.rest)*60000;}
function pomoTick(){
  if(!pomo.running)return;
  let l=pomo.endAt-Date.now();
  if(l<=0){
    if(pomo.phase==="work"){pomo.cycles++;
      if(pomo.blockId){const tk=todayKey();if(!data.pomoLog[tk])data.pomoLog[tk]={};
        data.pomoLog[tk][pomo.blockId]=(data.pomoLog[tk][pomo.blockId]||0)+1;
        /* 직접 저장 (save() 순환 방지) */
        store.set("planner-state",JSON.stringify(data));
        const cEl=document.getElementById("pomocount-"+pomo.blockId);
        if(cEl)cEl.textContent="🍅 "+pomoCountToday(pomo.blockId);}
      pomo.phase="rest";
    }else pomo.phase="work";
    pomo.leftMs=pomoDur(pomo.phase);pomo.endAt=Date.now()+pomo.leftMs;
  }else pomo.leftMs=l;
  pomoPaint();
}
function pomoPaint(){
  const t=document.getElementById("pomo-time");if(!t)return;
  const left=pomo.leftMs??pomoDur(pomo.phase);
  const mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);
  t.textContent=String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  const color=pomo.phase==="work"?"var(--accent)":"var(--good)";
  const ph=document.getElementById("pomo-phase");ph.textContent=pomo.phase==="work"?"집중":"휴식";ph.style.color=color;
  const C=2*Math.PI*48,ring=document.getElementById("pomo-ring");
  ring.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,left/pomoDur(pomo.phase))));
  ring.style.stroke=pomo.phase==="work"?data.theme.accent:"#0FA36B";
  const sb=document.getElementById("pomo-startbtn");sb.textContent=pomo.running?"일시정지":"시작";sb.style.background=pomo.running?"var(--danger)":color;
  const cy=document.getElementById("pomo-cycles");if(cy)cy.textContent="완료 "+pomo.cycles+"회";
  const bl=document.getElementById("pomo-block-label");if(pomo.blockId){const b=data.blocks.find(x=>x.id===pomo.blockId);bl.textContent=b?"▸ "+b.label:"";}else bl.textContent="";
}
function pomoStart(){if(pomo.leftMs==null)pomo.leftMs=pomoDur(pomo.phase);pomo.endAt=Date.now()+pomo.leftMs;pomo.running=true;if(!pomo.iv)pomo.iv=setInterval(pomoTick,250);pomoPaint();}
function pomoPause(){pomo.running=false;pomoPaint();}
function pomoResetTimer(ph){pomo.running=false;if(ph)pomo.phase=ph;pomo.leftMs=pomoDur(pomo.phase);pomoPaint();}

/* ── 스티커 드래그 ── */
const drag={active:false,id:null,scope:null,type:null,cx:0,cy:0,sl:0,st:0,sw:0};
const getClient=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
document.addEventListener("mousedown",sDragStart);document.addEventListener("touchstart",sDragStart,{passive:false});
function sDragStart(e){
  if(!ui.edit)return;const item=e.target.closest(".sticker-item");if(!item)return;
  if(e.target.closest(".del-handle")||e.target.closest(".sticker-ctrl"))return;
  if(e.cancelable)e.preventDefault();
  document.querySelectorAll(".sticker-item.selected").forEach(el=>{if(el!==item)el.classList.remove("selected");});
  item.classList.add("selected");
  const{x,y}=getClient(e);drag.active=true;drag.id=item.dataset.sid;drag.scope=item.dataset.scope;
  drag.type=e.target.closest(".resize-handle")?"resize":"move";
  drag.cx=x;drag.cy=y;drag.sl=parseFloat(item.style.left)||0;drag.st=parseFloat(item.style.top)||0;drag.sw=item.offsetWidth;drag.sh=item.offsetHeight;
}
function sDragMove(e){
  if(!drag.active)return;if(e.cancelable)e.preventDefault();
  const{x,y}=getClient(e);const el=document.getElementById("sticker-"+drag.id);if(!el)return;
  const rect=el.parentElement.getBoundingClientRect();
  if(drag.type==="move"){el.style.left=Math.max(0,Math.min(rect.width-20,drag.sl+(x-drag.cx)))+"px";el.style.top=Math.max(0,Math.min(rect.height-20,drag.st+(y-drag.cy)))+"px";}
  else{
    /* 가로/세로 자유 조절 — 비율 고정 없음 */
    const w=Math.max(36,drag.sw+(x-drag.cx));
    const hh=Math.max(28,drag.sh+(y-drag.cy));
    el.style.width=w+"px";el.style.height=hh+"px";
    /* 수동 글자 크기(fontSize)를 지정한 스티커는 리사이즈해도 글자 크기 유지 */
    const arr=drag.scope==="board"?data.boardStickers:data.screenStickers;
    const st=arr.find(s=>s.id===drag.id);
    if(!st||!st.fontSize){
      const inner=el.querySelector(".sticker-emoji-inner");if(inner)inner.style.fontSize=Math.round(Math.min(w,hh)*0.6)+"px";
      const ti=el.querySelector(".sticker-text-inner");if(ti)ti.style.fontSize=Math.max(10,Math.round(Math.min(w,hh)/7))+"px";
    }}
}
function sDragEnd(){
  if(!drag.active)return;drag.active=false;const el=document.getElementById("sticker-"+drag.id);if(!el)return;
  const arr=drag.scope==="board"?data.boardStickers:data.screenStickers;
  const s=arr.find(s=>s.id===drag.id);if(s){s.x=parseFloat(el.style.left)||0;s.y=parseFloat(el.style.top)||0;s.w=el.offsetWidth;s.h=el.offsetHeight;save();}
}
document.addEventListener("mousemove",sDragMove);document.addEventListener("touchmove",sDragMove,{passive:false});
document.addEventListener("mouseup",sDragEnd);document.addEventListener("touchend",sDragEnd);

/* ── 투두 드래그 정렬 — 마우스+터치 통합 (⠿ 핸들 포인터 방식) ── */
const tDrag={active:false,pid:null,fromIdx:null};
function tDragStart(e,pid,idx){
  if(e.cancelable)e.preventDefault();
  e.stopPropagation();
  tDrag.active=true;tDrag.pid=pid;tDrag.fromIdx=idx;
  const item=e.target.closest(".todo-item");
  if(item)item.classList.add("todo-dragging");
}
function tDragMove(e){
  if(!tDrag.active)return;
  if(e.cancelable)e.preventDefault();
  const{x,y}=getClient(e);
  const el=document.elementFromPoint(x,y);
  const item=el?el.closest(".todo-item"):null;
  document.querySelectorAll(".todo-item").forEach(t=>t.classList.remove("todo-dragover"));
  if(item&&item.dataset.tpid===tDrag.pid)item.classList.add("todo-dragover");
}
function tDragEnd(e){
  if(!tDrag.active)return;
  const pt=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:{x:e.clientX,y:e.clientY};
  const el=document.elementFromPoint(pt.x,pt.y);
  const item=el?el.closest(".todo-item"):null;
  document.querySelectorAll(".todo-item").forEach(t=>{t.classList.remove("todo-dragover");t.classList.remove("todo-dragging");});
  const wasActive=tDrag.active;tDrag.active=false;
  if(!wasActive||!item||item.dataset.tpid!==tDrag.pid)return;
  const toIdx=parseInt(item.dataset.tidx);
  if(isNaN(toIdx)||toIdx===tDrag.fromIdx)return;
  const p=data.projects.find(x=>x.id===tDrag.pid);if(!p)return;
  const todos=[...p.todos].sort((a,b)=>(a.order??0)-(b.order??0));
  const [moved]=todos.splice(tDrag.fromIdx,1);todos.splice(toIdx,0,moved);
  todos.forEach((t,i)=>t.order=i);save();render();
}
document.addEventListener("mousemove",tDragMove);
document.addEventListener("touchmove",tDragMove,{passive:false});
document.addEventListener("mouseup",tDragEnd);
document.addEventListener("touchend",tDragEnd);

        +'<div style="min-width:0;flex:1"><div class="todo-text">'+esc(it.todo.text)+'</div>'
        +'<div class="todo-sub">'+esc(it.projName)+' · '+fmtDur(it.hours)+'</div></div></div>').join("");

/* ── 뽀모도로 + 주간 차트 (9번) ── */
function cPomo(compact){
  const C=2*Math.PI*48;
  /* 주간 차트 데이터 */
  const today=todayDate();
  const weekData=Array.from({length:7},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-6+i);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const count=Object.values(data.pomoLog[key]||{}).reduce((s,v)=>s+v,0);
    return{label:DAY_NAMES[d.getDay()],count,isToday:key===todayKey()};
  });
  const maxC=Math.max(1,...weekData.map(w=>w.count));
  let h='<div class="card-head"><h2 class="card-title">뽀모도로</h2><span class="badge" id="pomo-cycles">완료 '+pomo.cycles+'회</span></div>'
    +'<div class="pomo-wrap"><div class="pomo-dial">'
    +'<svg width="116" height="116" viewBox="0 0 116 116"><circle cx="58" cy="58" r="48" fill="none" stroke="#EEF0F5" stroke-width="8"></circle>'
    +'<circle id="pomo-ring" cx="58" cy="58" r="48" fill="none" stroke="'+esc(data.theme.accent)+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0" transform="rotate(-90 58 58)" style="transition:stroke-dashoffset .25s linear"></circle></svg>'
    +'<div class="pomo-center"><span id="pomo-time">--:--</span><span id="pomo-phase">집중</span><span id="pomo-block-label"></span></div></div>'
    +'<div class="row" style="width:100%"><button class="btn" id="pomo-startbtn" style="flex:1" onclick="A.pomoToggle()">시작</button>'
    +'<button class="btn gray" style="flex:1" onclick="A.pomoReset()">초기화</button></div>'
    +'<div class="row" style="align-items:flex-end;flex-wrap:wrap;justify-content:center">'
    +'<label class="numfield">집중(분)<input type="number" min="1" max="120" value="'+data.pomodoro.work+'" onchange="A.pomoSetWork(this.value)"></label>'
    +'<label class="numfield">휴식(분)<input type="number" min="1" max="60" value="'+data.pomodoro.rest+'" onchange="A.pomoSetRest(this.value)"></label>'
    +'<button class="icon-btn" style="width:auto;padding:0 8px;height:36px;font-size:11px;font-weight:700" onclick="A.pomoSwitch()">전환</button>'
    +'<button class="icon-btn" style="width:auto;padding:0 8px;height:36px;font-size:11px;font-weight:700" onclick="A.pomoUnlink()">해제</button></div>';
  /* 주간 뽀모도로 차트 */
  h+='<div style="width:100%"><div style="font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px">🍅 뽀모도로 · 최근 7일</div>'
    +'<div class="pomo-chart">'
    +weekData.map(w=>'<div class="pomo-bar-wrap">'
      +'<div style="font-size:10px;color:'+(w.count>0?'var(--accent)':'var(--sub)')+';font-weight:800;margin-bottom:2px">'+(w.count>0?w.count:"")+'</div>'
      +'<div class="pomo-bar" style="height:'+Math.max(3,Math.round(w.count/maxC*48))+'px;background:'+(w.isToday?'var(--accent)':'#C5CCE8')+'"></div>'
      +'<div class="pomo-bar-label" style="color:'+(w.isToday?'var(--accent)':'var(--sub)')+'">'+w.label+'</div>'
      +'</div>').join("")
    +'</div></div>';
  /* 주간 완료 투두 차트 (3번) — todo.doneAt 기준 집계 */
  const todoWeek=Array.from({length:7},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-6+i);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    let count=0;
    for(const p of data.projects)for(const t of p.todos)if(t.done&&t.doneAt===key)count++;
    return{label:DAY_NAMES[d.getDay()],count,isToday:key===todayKey()};
  });
  const maxT=Math.max(1,...todoWeek.map(w=>w.count));
  h+='<div style="width:100%;margin-top:6px"><div style="font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px">✓ 완료한 투두 · 최근 7일</div>'
    +'<div class="pomo-chart">'
    +todoWeek.map(w=>'<div class="pomo-bar-wrap">'
      +'<div style="font-size:10px;color:'+(w.count>0?'var(--good)':'var(--sub)')+';font-weight:800;margin-bottom:2px">'+(w.count>0?w.count:"")+'</div>'

      +'</div>').join("")
    +'</div></div>';
  return h+'</div>';
}

function tableRow(b,tm){
  const tag=b.tagId?tm[b.tagId]:null;
  return'<div class="trow trow-click" onclick="A.blockPopupOpen(\''+b.id+'\')"><span class="ttime">'+fmtClock(b.start)+"–"+fmtClock(b.end)+'</span>'

    +(tag?'<span class="tag-chip" style="background:'+tag.color+'">'+esc(tag.name)+'</span>':"")+'</div>';
}
function circleHTML(timed,tm,size){
  const cx=size/2,cy=size/2,r1=size*0.427,r0=size*0.26;
  const pol=(r,hr)=>{const a=hr/24*2*Math.PI-Math.PI/2;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const seg=(h1,h2,fill,main,sub,bid)=>{
    if(h2-h1<=0.01)return"";const lg=h2-h1>12?1:0;
    const[x1,y1]=pol(r1,h1),[x2,y2]=pol(r1,h2),[x3,y3]=pol(r0,h2),[x4,y4]=pol(r0,h1);
    const mid=(h1+h2)/2,[lx,ly]=pol((r0+r1)/2,mid);const two=h2-h1>=2.5&&sub&&size>=260;
    let txt="";
    if(h2-h1>=1.4&&main)txt='<text x="'+lx+'" y="'+(two?ly-5:ly)+'" text-anchor="middle" dominant-baseline="middle" style="font-size:'+(size>=260?9.5:8.5)+'px;font-weight:800;fill:#fff">'+esc(main.slice(0,5))+'</text>'
      +(two?'<text x="'+lx+'" y="'+(ly+7)+'" text-anchor="middle" dominant-baseline="middle" style="font-size:8px;fill:rgba(255,255,255,.8)">'+esc(sub.slice(0,6))+'</text>':"");
    return'<path d="M '+x1+" "+y1+" A "+r1+" "+r1+" 0 "+lg+" 1 "+x2+" "+y2+" L "+x3+" "+y3+" A "+r0+" "+r0+" 0 "+lg+" 0 "+x4+" "+y4+' Z" fill="'+fill+'" stroke="#fff" stroke-width="2"'+(bid?' onclick="A.blockPopupOpen(\''+bid+'\')"':'')+'></path>'+txt;
  };
  let segs="";
  for(const b of timed){const tag=b.tagId?tm[b.tagId]:null,color=tag?tag.color:"#CBD2DE";const main=tag?tag.name:b.label,sub=tag?b.label:null;const s=((b.start%24)+24)%24,e=s+b.hours;
    if(e<=24)segs+=seg(s,e,color,main,sub,b.id);
    else{segs+=seg(s,24,color,main,sub,b.id);segs+=seg(0,e-24,color,main,sub,b.id);}}
  const now=new Date(),nowH=now.getHours()+now.getMinutes()/60;const[nx1,ny1]=pol(r0-5,nowH),[nx2,ny2]=pol(r1+5,nowH);
  let ticks="";for(const hh of[0,6,12,18]){const[tx,ty]=pol(r1+13,hh);ticks+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" dominant-baseline="middle" style="font-size:10px;fill:var(--sub);font-weight:700">'+hh+'</text>';}
  return'<div style="display:flex;justify-content:center"><svg class="circle-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+" "+size+'">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+((r0+r1)/2)+'" fill="none" stroke="#F0F2F6" stroke-width="'+(r1-r0)+'"></circle>'
    +segs+ticks+'<line x1="'+nx1+'" y1="'+ny1+'" x2="'+nx2+'" y2="'+ny2+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"></line>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--ink)"></circle>'
    +'<text x="'+cx+'" y="'+(cy-7)+'" text-anchor="middle" style="font-size:11px;fill:var(--sub)">지금</text>'
    +'<text x="'+cx+'" y="'+(cy+11)+'" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--ink)">'+fmtClock(nowH)+'</text></svg></div>';
}

/* ── 오늘의 투두 ── */
function cTodayTodos(compact,ctx){
  const{plan,sim}=ctx,tm=tagMap(),timed=blockTimes();
  const behind=getBehindProjects(sim);
  let h='<div class="card-head"><h2 class="card-title">오늘의 투두</h2>'
    +'<div class="row" style="gap:4px">'
    +[["block","블록순"],["urgent","급한순"],["priority","우선순위"]].map(([k,l])=>'<button class="chip-btn'+(data.todoSort===k?" on":"")+'" onclick="A.setTodoSort(\''+k+'\')">'+l+'</button>').join("")
    +'</div></div>';

  const allItems=Object.values(plan.queues).flat();
  if(!allItems.length&&!behind.length)return h+'<p class="empty">계획 탭에서 블록에 태그를 연결하고 프로젝트를 추가하면 오늘의 투두가 자동 배치됩니다.</p>';
  if(data.todoSort==="block"){
    for(const b of timed){
      const items=plan.byBlock[b.id]||[];if(!b.tagId||!items.length)continue;
      const tag=tm[b.tagId];
      const show=compact?items.slice(0,3):items;
      h+='<div style="margin-bottom:12px"><div class="block-head">'
        +'<span class="block-bar" style="background:'+(tag?tag.color:"var(--line)")+'"></span>'
        +'<span style="font-weight:800;font-size:13px">'+esc(b.label)+'</span>'
        +'<span class="tag-chip" style="background:'+(tag?tag.color:"#999")+'">'+esc(tag?tag.name:"")+'</span>'
        +(!compact?'<span style="font-size:11px;color:var(--sub)">'+fmtClock(b.start)+"–"+fmtClock(b.end)+'</span>'
          +'<span id="pomocount-'+b.id+'" style="font-size:11px;color:var(--sub)">'+(pomoCountToday(b.id)>0?"🍅 "+pomoCountToday(b.id):"")+'</span>'
          +'<button class="chip-btn" style="margin-left:auto" onclick="A.pomoBlock(\''+b.id+'\')">▶</button>':"")
        +'</div>'+show.map(it=>todoRowHTML(it,tag?tag.color:"var(--sub)",compact)).join("")
        +(compact&&items.length>3?'<p class="hint" style="margin:2px 0 0 9px">외 '+(items.length-3)+'개…</p>':"")+'</div>';
    }
    for(const tagId of Object.keys(plan.unplaced)){const tag=tm[tagId];
      h+='<div style="margin-bottom:12px"><div class="block-head"><span class="block-bar" style="background:'+tag.color+'"></span><span style="font-weight:800;font-size:13px">'+esc(tag.name)+'</span><span style="font-size:11px;color:var(--danger)">연결된 블록 없음</span></div>'+plan.unplaced[tagId].map(it=>todoRowHTML(it,tag.color,compact)).join("")+'</div>';}
  }else{
    let items=[...allItems];
    if(data.todoSort==="urgent")items.sort((a,b)=>{const da=a.deadline?calcDDayNum(a.deadline):9e9,db=b.deadline?calcDDayNum(b.deadline):9e9;return da-db||a.priority-b.priority;});
    else items.sort((a,b)=>a.priority-b.priority);
    const show=compact?items.slice(0,5):items;
    h+=show.map(it=>{const tag=tm[it.tagId];return todoRowHTML(it,tag?tag.color:"var(--sub)",compact,true,tag);}).join("");
    if(compact&&items.length>5)h+='<p class="hint">외 '+(items.length-5)+'개…</p>';
  }
  /* ── 지난 투두란 (5번) —
     예정 종료일이 설정 마감일을 넘긴 프로젝트의 "따라잡기" 투두들.
     계획된 배분 외에 이만큼 더 해내면 원래 마감일에 맞출 수 있음 ── */
  if(behind.length){
    h+='<div style="margin-top:14px;padding-top:12px;border-top:2px dashed #FFD6DF">'
      +'<div style="font-size:12px;font-weight:800;color:var(--danger);margin-bottom:3px">⏰ 지난 투두 — 마감 기한 복구용</div>'
      +'<p style="font-size:11px;color:var(--sub);margin:0 0 8px">지금 속도로는 마감을 넘겨요. 계획 외 시간에 아래를 해치우면 원래 마감일에 맞출 수 있어요.</p>';
    for(const g of behind){
      const showItems=compact?g.extraTodos.slice(0,2):g.extraTodos;
      const dChip=g.daysLeft>=0?'마감까지 D-'+g.daysLeft:'마감 '+Math.abs(g.daysLeft)+'일 초과';
      h+='<div style="background:#FFF9FA;border:1px solid #FFE3EA;border-radius:10px;padding:9px;margin-bottom:8px">'
        +'<div class="row" style="gap:6px;margin-bottom:4px;flex-wrap:wrap">'
        +'<span style="width:8px;height:8px;border-radius:2px;background:'+g.tagColor+';flex-shrink:0"></span>'
        +'<span style="font-size:13px;font-weight:800">'+esc(g.projName)+'</span>'
        +'<span class="overdue-chip">'+dChip+'</span>'
        +(g.finish?'<span style="font-size:11px;color:var(--sub)">현재 예정 '+fmtDate(new Date(g.finish))+' 종료</span>':'<span style="font-size:11px;color:var(--danger)">현재 속도론 종료 불가</span>')
        +'<span style="font-size:11px;color:var(--danger);font-weight:700;margin-left:auto">+'+g.extraTodos.length+'개 · '+fmtDur(g.extraHours)+' 더 필요</span></div>'
        +showItems.map(t=>'<div class="todo'+(t.done?" done":"")+'">'
          +'<button class="check" style="'+(t.done?"background:"+g.tagColor+";border-color:"+g.tagColor:"")+'" onclick="A.toggleTodo(\''+g.projectId+'\',\''+t.id+'\')">'+( t.done?"✓":"")+'</button>'
          +'<div style="min-width:0;flex:1"><div class="todo-text" style="font-size:13px">'+esc(t.text)+'</div>'
          +'<div class="todo-sub">'+fmtDur(g.hours)+'</div></div></div>').join("")
        +(compact&&g.extraTodos.length>2?'<p class="hint" style="margin:2px 0 0">외 '+(g.extraTodos.length-2)+'개…</p>':"")
        +'</div>';
    }
    h+='</div>';
  }
  return h;
}
function todoRowHTML(it,color,compact,withMeta,tag){
  let meta=esc(it.projName)+" · "+fmtDur(it.hours);
  if(withMeta&&it.deadline){const n=calcDDayNum(it.deadline);meta+=' · <span class="deadline-chip" style="background:'+(n<=3?"var(--danger)":"var(--line)")+';color:'+(n<=3?"#fff":"var(--sub)")+'">'+calcDDay(it.deadline)+'</span>';}
  return'<div class="todo'+(it.todo.done?" done":"")+'">'
    +'<button class="check" style="'+(it.todo.done?"background:"+color+";border-color:"+color:"")+'" onclick="A.toggleTodo(\''+it.projectId+'\',\''+it.todo.id+'\')">'+( it.todo.done?"✓":"")+'</button>'
    +'<div style="min-width:0;flex:1"><div class="todo-text">'+(withMeta&&tag?'<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+tag.color+';margin-right:5px"></span>':"")
    +esc(it.todo.text)+'</div><div class="todo-sub">'+meta+'</div></div></div>';
}

  return h;

function projBoardHTML(sim,tm){
  if(!data.projects.length)return'<p class="empty">아직 프로젝트가 없습니다.</p>';
  let h='<div class="dash">';
  for(const tag of data.tags){
    const projs=data.projects.filter(p=>p.tagId===tag.id).sort((a,b)=>{
      const da=isProjDone(a)?1:0, db=isProjDone(b)?1:0;

    });if(!projs.length)continue;
    h+='<div class="dash-col"><div class="dash-col-head" style="background:'+tag.color+'">'+esc(tag.name)+'<span style="margin-left:auto;font-size:11px;opacity:.85">'+projs.length+'</span></div>';
    for(const p of projs){
      const doneCnt=p.todos.filter(t=>t.done).length,pct=p.todos.length?Math.round(doneCnt/p.todos.length*100):0;
      const minDH=calcMinDailyHours(p,sim);

        +'<div class="row" style="gap:5px;margin-bottom:5px"><span style="font-weight:800;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'
        +(p.deadline?'<span class="deadline-chip" style="background:'+(calcDDayNum(p.deadline)<=3?"var(--danger)":"var(--line)")+';color:'+(calcDDayNum(p.deadline)<=3?"#fff":"var(--sub)")+'">'+calcDDay(p.deadline)+'</span>':"")+'</div>'
        +'<div class="progress" style="margin-bottom:4px"><div style="width:'+pct+'%;background:'+tag.color+'"></div></div>'
        +(minDH?'<div style="font-size:10px;color:var(--danger);font-weight:700;margin-bottom:4px">일 최소 '+minDH+'h</div>':"")
        +p.todos.sort((a,b)=>(a.order??0)-(b.order??0)).map(t=>'<div class="row" style="gap:6px;padding:2px 0"><button class="check" style="width:18px;height:18px;font-size:10px;border-radius:6px;'+(t.done?"background:"+tag.color+";border-color:"+tag.color:"")+'" onclick="A.toggleTodo(\''+p.id+'\',\''+t.id+'\')">'+( t.done?"✓":"")+'</button><span style="font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(t.done?"text-decoration:line-through;color:var(--sub)":"")+'">'+esc(t.text)+'</span></div>').join("")
        +'</div>';
    }h+='</div>';
  }return h+'</div>';
}

/* ── 이미지 파일 처리 ── */
function fileToSticker(input,cb){
  const f=input.files&&input.files[0];if(!f)return;
  const keepAlpha=/png|webp|gif|svg/i.test(f.type);
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const MAX=800,sc=Math.min(1,MAX/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(keepAlpha?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",0.82));};img.src=rd.result;};
  rd.readAsDataURL(f);input.value="";
}

/* ══════════════════════════════════════════════════════════════
   Firebase 인증 + Realtime Database 동기화
   · Google 로그인 — 본인 계정만 데이터 접근 가능
   · 암호화 없이 UID 기반 보안 (Firebase 규칙으로 보호)
   · 직렬화 오류 없음, 실시간 WebSocket 동기화
══════════════════════════════════════════════════════════════ */
let fbApp=null, fbAuth=null, fbDb=null;
let fbUser=null, fbCfg=null;
let fbState={status:"off",last:0,msg:""};
let fbListener=null, fbIsPushing=false;

function fbLoadCfg(){
  try{const r=localStorage.getItem("planner-fb2");fbCfg=r?JSON.parse(r):null;}catch{fbCfg=null;}
}
function fbSaveCfg(){
  try{if(fbCfg)localStorage.setItem("planner-fb2",JSON.stringify(fbCfg));
    else localStorage.removeItem("planner-fb2");}catch{}
}
const fbReady=()=>!!(fbCfg&&fbCfg.url&&fbCfg.apiKey);
const fbAuthed=()=>!!(fbUser&&fbDb);

/* Firebase SDK를 동적으로 로드 */
function fbLoadSDK(cb){
  if(window.firebase){cb();return;}
  const s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
  s1.onload=()=>{
    const s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js';
    s2.onload=()=>{
      const s3=document.createElement('script');
      s3.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';
      s3.onload=cb;
      document.head.appendChild(s3);
    };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function fbInit(cfg, onReady){
  fbLoadSDK(()=>{
    try{
      if(!fbApp){
        // projectId: databaseURL에서 추출 (-default-rtdb 등 접미사 제거)
        const projectId=(cfg.url.match(/\/\/([^.]+)/)?.[1]||"").replace(/-default-rtdb$/,"");
        fbApp=firebase.initializeApp({
          apiKey: cfg.apiKey,
          authDomain: projectId+".firebaseapp.com",
          databaseURL: cfg.url,
          projectId: projectId,
        });
      }
      fbAuth=firebase.auth(fbApp);
      fbDb=firebase.database(fbApp);
      fbAuth.onAuthStateChanged(user=>{
        fbUser=user;
        if(user){
          fbState.status="ok";
          onReady&&onReady(user);
          fbListen();
        }else{
          fbState={status:"login",last:0,msg:""};
          fbStopListen();
        }
        render();paintSync();
      });
    }catch(e){
      fbState={status:"err",last:0,msg:fbFriendlyErr(e)};
      paintSync();
    }
  });
}

function fbSignIn(){
  if(!fbAuth)return;
  const provider=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e=>{
    fbState={status:"err",last:0,msg:fbFriendlyErr(e)};
    paintSync();render();
  });
}
function fbSignOut(){
  fbStopListen();
  if(fbAuth)fbAuth.signOut();
  fbUser=null;
  fbState={status:"login",last:0,msg:""};
  render();
}

/* 데이터 경로: /planner/{uid}/data */
const fbDataRef=()=>fbDb&&fbUser?fbDb.ref('planner/'+fbUser.uid+'/data'):null;

/* 올리기 */
async function fbPush(){
  if(!fbAuthed()||fbIsPushing||!data)return;
  fbIsPushing=true;
  try{
    const ref=fbDataRef();
    if(!ref)throw new Error("ref 없음");
    // JSON 직렬화만 (암호화 없음 — UID 규칙으로 보호)
    const payload=JSON.parse(JSON.stringify(data)); // 순수 복사본
    await ref.set({payload:JSON.stringify(payload), updatedAt:data.updatedAt||Date.now()});
    fbState={status:"ok",last:Date.now(),msg:""};
  }catch(e){
    fbState={status:"err",last:fbState.last,msg:fbFriendlyErr(e)};
  }finally{
    fbIsPushing=false;paintSync();
  }
}

/* 실시간 리스너 — 다른 기기에서 변경하면 즉시 반영 */
function fbListen(){
  if(!fbAuthed())return;
  fbStopListen();
  const ref=fbDataRef();
  if(!ref)return;
  fbListener=ref.on('value', snap=>{
    try{
      const remote=snap.val();
      if(!remote||!remote.payload)return;
      const remoteAt=remote.updatedAt||0;
      const localAt=data?data.updatedAt||0:0;
      if(remoteAt>localAt+500){
        // 서버가 더 최신 → 반영
        const obj=JSON.parse(remote.payload);
        data=migrate(obj);applyTheme();
        store.set("planner-state",JSON.stringify(data));
        render();
      }
      fbState={status:"ok",last:Date.now(),msg:""};
      paintSync();
    }catch(e){
      fbState={status:"err",last:fbState.last,msg:fbFriendlyErr(e)};
      paintSync();
    }
  }, e=>{
    fbState={status:"err",last:fbState.last,msg:fbFriendlyErr(e)};
    paintSync();
  });
}
function fbStopListen(){
  if(fbListener&&fbDb&&fbUser){
    const ref=fbDataRef();
    if(ref)ref.off('value',fbListener);
  }
  fbListener=null;
}

function fbFriendlyErr(e){
  const s=String((e&&(e.message||e.code))||e);
  if(/permission-denied|PERMISSION_DENIED/i.test(s))return"권한 없음 — Firebase 규칙을 확인하세요";
  if(/network-request-failed|Failed to fetch/i.test(s))return"네트워크 연결을 확인하세요";
  if(/popup-blocked/i.test(s))return"팝업이 차단됐어요 — 팝업 허용 후 다시 시도";
  if(/auth\/unauthorized-domain/i.test(s))return"이 도메인이 Firebase에 등록되지 않았어요";
  if(/cancelled-popup-request/i.test(s))return"로그인이 취소됐어요";
  return s.slice(0,60);
}

function paintSync(){
  const el=document.getElementById("sync-status");if(!el)return;
  if(!fbReady()){el.textContent="미연결";el.style.color="var(--sub)";return;}
  if(!fbUser){el.textContent="로그인 필요";el.style.color="var(--sub)";return;}
  el.textContent=fbState.status==="ok"?"☁ "+new Date(fbState.last).toLocaleTimeString()
    :fbState.status==="err"?"오류: "+fbState.msg
    :fbState.status==="syncing"?"동기화 중…":"";
  el.style.color=fbState.status==="err"?"var(--danger)":"var(--sub)";
}

/* ══════════ 동작 핸들러 ══════════ */
const A={
  tab(k){ui.tab=k;render();},
  editToggle(){ui.edit=!ui.edit;ui.addDDay=false;render();},
  settingsToggle(){ui.settingsOpen=!ui.settingsOpen;render();},
  setView(v){data.view=v;save();render();},
  setTodoSort(v){data.todoSort=v;save();render();},
  setProjView(v){data.projView=v;save();render();},
  toggleTodo(pid,tid){
    const p=data.projects.find(x=>x.id===pid),t=p.todos.find(x=>x.id===tid);
    t.done=!t.done;t.doneAt=t.done?todayKey():null;save();render();},
  /* 컨테이너 */
  cDragStart(e,cid){e.dataTransfer.setData("text/plain",cid);e.dataTransfer.effectAllowed="move";},
  cDrop(e,panel){e.preventDefault();document.querySelectorAll(".panel").forEach(p=>p.classList.remove("droptarget"));const cid=e.dataTransfer.getData("text/plain");if(!cid||!SECTION_LABELS[cid])return;const tab=curTab();tab.aux=tab.aux.filter(c=>c!==cid);tab.main=tab.main.filter(c=>c!==cid);tab[panel].push(cid);save();render();},
  cSwapPanel(cid){const tab=curTab();if(tab.aux.includes(cid)){tab.aux=tab.aux.filter(c=>c!==cid);tab.main.push(cid);}else{tab.main=tab.main.filter(c=>c!==cid);tab.aux.push(cid);}save();render();},
  cMoveOrder(cid,dir){const tab=curTab();const arr=tab.aux.includes(cid)?tab.aux:tab.main;const i=arr.indexOf(cid),j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render();},
  cRemove(cid){const tab=curTab();tab.aux=tab.aux.filter(c=>c!==cid);tab.main=tab.main.filter(c=>c!==cid);save();render();},
  cAdd(cid){curTab().main.push(cid);save();render();},
  resetLayout(){if(!confirm("탭 구성을 기본 배치로 초기화할까요? (데이터는 유지)"))return;data.tabs=defaultTabs();ui.tab="main";save();render();},
  tabAdd(){const name=prompt("새 탭 이름");if(!name||!name.trim())return;const id=uid();data.tabs.push({id,name:name.trim(),builtin:false,aux:[],main:[]});ui.tab=id;save();render();},
  tabRename(){const tab=curTab();if(tab.builtin)return;const name=prompt("탭 이름 변경",tab.name);if(!name||!name.trim())return;tab.name=name.trim();save();render();},
  tabDel(){const tab=curTab();if(tab.builtin)return;if(!confirm("'"+tab.name+"' 탭을 삭제할까요?"))return;data.screenStickers=data.screenStickers.filter(s=>s.tabId!==tab.id);data.tabs=data.tabs.filter(t=>t.id!==tab.id);ui.tab="main";save();render();},
  /* 뽀모도로 */
  pomoBlock(bid){pomo.blockId=bid;pomoResetTimer("work");pomoStart();},
  pomoToggle(){pomo.running?pomoPause():pomoStart();},
  pomoReset(){pomoResetTimer();},
  pomoSwitch(){pomoResetTimer(pomo.phase==="work"?"rest":"work");},
  pomoUnlink(){pomo.blockId=null;pomoPaint();},
  pomoSetWork(v){data.pomodoro.work=Math.max(1,Math.min(120,parseInt(v)||25));if(!pomo.running)pomo.leftMs=pomoDur(pomo.phase);save();pomoPaint();},
  pomoSetRest(v){data.pomodoro.rest=Math.max(1,Math.min(60,parseInt(v)||5));if(!pomo.running)pomo.leftMs=pomoDur(pomo.phase);save();pomoPaint();},
  /* D-Day */
  ddayShowAdd(){ui.addDDay=true;render();},ddayHideAdd(){ui.addDDay=false;render();},
  ddayAdd(){const name=document.getElementById("dd-name")?.value.trim(),date=document.getElementById("dd-date")?.value,color=document.getElementById("dd-color")?.value||PALETTE[0];if(!name||!date)return;data.ddays.push({id:uid(),name,date,color});ui.addDDay=false;save();render();},
  ddayDel(id){data.ddays=data.ddays.filter(d=>d.id!==id);save();render();},
  /* 보드 */
  boardPrompt(type){const v=prompt(type==="emoji"?"이모지 입력":"텍스트 입력");if(!v||!v.trim())return;data.boardStickers.push(type==="emoji"?{id:uid(),type:"emoji",emoji:v.trim(),x:15,y:15,w:70}:{id:uid(),type:"text",text:v.trim(),x:15,y:15,w:110});save();render();},
  boardFile(input){fileToSticker(input,src=>{data.boardStickers.push({id:uid(),type:"image",src,x:15,y:15,w:95});save();render();});},
  boardHSet(v){data.boardH=parseInt(v)||200;save();render();},
  /* 화면 스티커 */
  screenPrompt(type){const v=prompt(type==="emoji"?"이모지 입력":"텍스트 입력");if(!v||!v.trim())return;data.screenStickers.push(type==="emoji"?{id:uid(),tabId:ui.tab,type:"emoji",emoji:v.trim(),x:40,y:120,w:70}:{id:uid(),tabId:ui.tab,type:"text",text:v.trim(),x:40,y:120,w:120});save();render();},
  screenFile(input){fileToSticker(input,src=>{data.screenStickers.push({id:uid(),tabId:ui.tab,type:"image",src,x:40,y:120,w:100});save();render();});},
  stickerDel(scope,id){if(scope==="board")data.boardStickers=data.boardStickers.filter(s=>s.id!==id);else data.screenStickers=data.screenStickers.filter(s=>s.id!==id);save();render();},
  /* 레이어 앞뒤 조절 (5번) */
  stickerZ(scope,id,dir){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s)return;
    s.z=Math.max(1,Math.min(50,(s.z||1)+dir));
    const el=document.getElementById("sticker-"+id);
    if(el)el.style.zIndex=s.z;
    save();},
  /* 글자 크기 조절 (1번) */
  stickerFont(scope,id,delta){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s||s.type==="image")return;
    const cur=s.fontSize||(s.type==="emoji"?Math.round((s.w||80)*0.6):Math.max(10,Math.round((s.w||80)/7)));
    s.fontSize=Math.max(8,Math.min(120,cur+delta));
    const el=document.getElementById("sticker-"+id);
    if(el){const inner=el.querySelector(".sticker-emoji-inner,.sticker-text-inner");if(inner)inner.style.fontSize=s.fontSize+"px";}
    save();},
  /* 텍스트 내용 수정 — 더블클릭 또는 ✏️ (줄바꿈 지원: \n 그대로 저장됨) */
  stickerEditText(scope,id){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s||s.type!=="text")return;
    const v=prompt("내용 수정 (줄바꿈은 \\n 입력 또는 그대로 유지됨)",s.text);
    if(v===null)return;
    s.text=v.replace(/\\n/g,"\n"); /* \n 입력을 실제 줄바꿈으로 */
    save();render();},
  /* 글꼴·스타일 팝업 (3번) */
  stickerStyleOpen(scope,id){ui.stylePopup={scope,id};render();},
  stickerStyleClose(){ui.stylePopup=null;render();},
  stickerSetFont(scope,id,val){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s)return;
    s.fontFamily=val;save();render();},
  stickerBold(scope,id){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s)return;
    s.bold=!s.bold;save();render();},
  stickerColor(scope,id,c){
    const arr=scope==="board"?data.boardStickers:data.screenStickers;
    const s=arr.find(x=>x.id===id);if(!s)return;
    s.color=c;save();render();},
  /* 블록 투두 팝업 (4번) */
  blockPopupOpen(bid){ui.blockPopup=bid;render();},
  blockPopupClose(){ui.blockPopup=null;render();},
  /* 프로젝트 */
  pAdd(){
    const name=document.getElementById("p-name")?.value.trim();
    const tagId=document.getElementById("p-tag")?.value;
    const hptMin=parseInt(document.getElementById("p-hpt")?.value)||60;
    const dl=document.getElementById("p-deadline")?.value||null;
    const capV=parseFloat(document.getElementById("p-cap")?.value);
    if(!name||!tagId)return;
    data.projects.push({id:uid(),name,tagId,hoursPerTodo:min2hpt(hptMin),priority:data.projects.length+1,todos:[],deadline:dl,dailyCap:isNaN(capV)||capV<=0?null:capV});
    ui.openProject=data.projects[data.projects.length-1].id;save();render();},
  pMove(id,dir){const arr=data.projects.sort((a,b)=>a.priority-b.priority);const i=arr.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=arr.length)return;const t=arr[i].priority;arr[i].priority=arr[j].priority;arr[j].priority=t;save();render();},
  pDel(id){data.projects=data.projects.filter(p=>p.id!==id);data.projects.sort((a,b)=>a.priority-b.priority).forEach((p,k)=>p.priority=k+1);save();render();},
  pOpen(id){ui.openProject=ui.openProject===id?null:id;render();},
  pEditToggle(id){ui.editProject=ui.editProject===id?null:id;render();},
  pSetName(id,v){const p=data.projects.find(x=>x.id===id);if(p){p.name=v;save();}},
  pSetTag(id,v){const p=data.projects.find(x=>x.id===id);if(p){p.tagId=v;save();render();}},
  pSetHpt(id,v){const p=data.projects.find(x=>x.id===id);if(p){p.hoursPerTodo=min2hpt(parseInt(v)||60);save();render();}},
  pSetCap(id,v){const p=data.projects.find(x=>x.id===id);if(p){const n=parseFloat(v);p.dailyCap=isNaN(n)||n<=0?null:n;save();render();}},
  pDeadline(id,v){const p=data.projects.find(x=>x.id===id);if(p){p.deadline=v||null;save();render();}},
  todoText(pid,tid,v){data.projects.find(p=>p.id===pid).todos.find(t=>t.id===tid).text=v;save();},
  todoDel(pid,tid){const p=data.projects.find(x=>x.id===pid);p.todos=p.todos.filter(t=>t.id!==tid);p.todos.forEach((t,i)=>t.order=i);save();render();},
  todoAdd(pid){const el=document.getElementById("new-todo");const v=el?.value.trim();if(!v)return;const p=data.projects.find(x=>x.id===pid);p.todos.push({id:uid(),text:v,done:false,doneAt:null,order:p.todos.length});save();render();},
  todoGenRange(pid){
    const prefix=document.getElementById("gen-prefix")?.value||"";
    const suffix=document.getElementById("gen-suffix")?.value||"";
    const from=parseInt(document.getElementById("gen-from")?.value)||1;
    const to=parseInt(document.getElementById("gen-to")?.value)||10;
    const limitV=parseInt(document.getElementById("gen-limit")?.value);
    const limit=isNaN(limitV)||limitV<=0?Infinity:limitV;
    if(from>to){alert("시작 숫자가 끝 숫자보다 클 수 없어요.");return;}
    if(to-from+1>500){alert("한 번에 최대 500개까지 생성할 수 있어요.");return;}
    const p=data.projects.find(x=>x.id===pid);let count=0;
    for(let n=from;n<=to&&count<limit;n++,count++){
      p.todos.push({id:uid(),text:prefix+" "+n+suffix,done:false,doneAt:null,order:p.todos.length});
    }
    save();render();},
  /* 태그/블록 */
  tagColor(i,v){data.tags[i].color=v;save();render();},
  tagName(i,v){data.tags[i].name=v;save();},
  tagDel(i){const id=data.tags[i].id;data.tags.splice(i,1);data.projects=data.projects.filter(p=>p.tagId!==id);data.blocks.forEach(b=>{if(b.tagId===id)b.tagId=null;});save();render();},
  tagHours(i,dw,v){data.tags[i].weekHours[dw]=Math.max(0,parseFloat(v)||0);save();},
  tagAdd(){const el=document.getElementById("new-tag");const v=el?.value.trim();if(!v)return;data.tags.push({id:uid(),name:v,color:PALETTE[data.tags.length%PALETTE.length],weekHours:{0:0,1:1,2:1,3:1,4:1,5:1,6:0}});save();render();},
  setDayStart(v){data.dayStart=parseFloat(v)||0;save();render();},
  blockLabel(i,v){data.blocks[i].label=v;save();},
  blockHours(i,v){data.blocks[i].hours=Math.max(0.5,parseFloat(v)||0.5);save();render();},
  blockTag(i,v){data.blocks[i].tagId=v||null;save();render();},
  blockMove(i,dir){const j=i+dir;if(j<0||j>=data.blocks.length)return;[data.blocks[i],data.blocks[j]]=[data.blocks[j],data.blocks[i]];save();render();},
  blockDel(i){data.blocks.splice(i,1);save();render();},
  blockAdd(){data.blocks.push({id:uid(),label:"새 블록",hours:1,tagId:null});save();render();},
  /* 테마 */
  themeSet(k,v){data.theme[k]=v;applyTheme();save();if(k==="accent")pomoPaint();},
  themeReset(){data.theme={...DEFAULT_THEME};applyTheme();save();render();},
  /* 동기화 */
  syncConnect(){
    const url=document.getElementById("sy-url")?.value.trim();
    const apiKey=document.getElementById("sy-key")?.value.trim();
    if(!url||!apiKey){alert("URL과 API 키를 모두 입력해 주세요.");return;}
    if(!/^https:\/\//.test(url)){alert("URL은 https://로 시작해야 해요.");return;}
    fbCfg={url,apiKey};fbSaveCfg();
    fbInit(fbCfg,()=>{fbPull&&fbPull();});
    render();
  },
  syncLogin(){fbSignIn();},
  syncNow(){
    const ref=fbDataRef();
    if(!ref){alert("로그인이 필요해요.");return;}
    ref.once('value').then(snap=>{
      const remote=snap.val();
      if(remote&&remote.payload){
        const remoteAt=remote.updatedAt||0;
        if(remoteAt>(data.updatedAt||0)+500){
          data=migrate(JSON.parse(remote.payload));applyTheme();render();
          store.set("planner-state",JSON.stringify(data));
        }else{fbPush();}
      }else{fbPush();}
      fbState={status:"ok",last:Date.now(),msg:""};paintSync();
    }).catch(e=>{fbState={status:"err",last:fbState.last,msg:fbFriendlyErr(e)};paintSync();});
  },
  syncOff(){
    if(!confirm("Firebase 동기화를 해제하고 로그아웃할까요?"))return;
    fbSignOut();fbCfg=null;fbSaveCfg();render();
  },
  /* 백업 */
  exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="block-planner-"+todayKey()+".json";a.click();URL.revokeObjectURL(a.href);},
  importData(input){const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{data=migrate(JSON.parse(rd.result));applyTheme();save();render();alert("백업을 불러왔어요!");}catch{alert("파일을 읽을 수 없어요.");}};rd.readAsText(f);input.value="";}
};
window.A=A;window.tDragStart=tDragStart;

/* ── 시작 ── */
(async function init(){
  setBadge("불러오는 중…");fbLoadCfg();
  let raw=await store.get("planner-state");
  try{data=migrate(raw?JSON.parse(raw):null);}catch{data=makeDefault();}
  applyTheme();setBadge(fmtDate(new Date()));render();
  // Firebase 설정이 있으면 SDK 로드 + 로그인 상태 감지 시작
  if(fbReady())fbInit(fbCfg, ()=>{});
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&fbAuthed())fbPush();
  });
  setInterval(()=>{if(data.view!=="circle")return;document.querySelectorAll(".circle-svg").forEach(sv=>{const compact=parseInt(sv.getAttribute("width"))<=200;const tmp=document.createElement("div");tmp.innerHTML=circleHTML(blockTimes(),tagMap(),compact?200:300);if(sv.parentElement)sv.parentElement.replaceWith(tmp.firstChild);});},60000);
})();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
